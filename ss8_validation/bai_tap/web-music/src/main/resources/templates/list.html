<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Danh Sách Bài Hát</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    body { background: #eef1f7; }

    .container-box {
      margin-top: 40px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    audio { width: 280px; }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>

<!-- 🔥 TOAST (Thông báo) -->
<div class="toast-container">
  <div th:if="${msg != null}"
       class="toast text-bg-success border-0"
       id="toastMsg"
       role="alert"
       aria-live="assertive"
       aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">Thông báo</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body" th:text="${msg}"></div>
  </div>
</div>

<script>
  window.onload = function() {
    let t = document.getElementById("toastMsg");
    if (t) new bootstrap.Toast(t).show();
  };
</script>


<div class="container container-box">
  <h3 class="text-center mb-4">🎧 Danh Sách Bài Hát</h3>

  <div class="mb-3 text-end">
    <a href="/songs/upload" class="btn btn-success px-3 py-2 fw-bold">
      <i class="bi bi-cloud-upload"></i> Upload bài hát
    </a>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
      <th style="width: 40px;">#</th>
      <th>Tên bài hát</th>
      <th>Nghệ sĩ</th>
      <th>Thể loại</th>
      <th style="width: 320px;">Nghe thử</th>
      <th style="width: 180px;">Tùy chọn</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="song : ${songs}">
      <td th:text="${song.id}"></td>
      <td th:text="${song.name}"></td>
      <td th:text="${song.artist}"></td>
      <td th:text="${song.category}"></td>

      <td>
        <audio controls>
          <source th:src="@{'/uploads/' + ${song.filePath}}">
        </audio>
      </td>

      <td>
        <a th:href="@{'/songs/edit/' + ${song.id}}"
           class="btn btn-warning btn-sm">
          <i class="bi bi-pencil-square"></i> Sửa
        </a>

        <!-- ❗ Nút mở modal xoá -->
        <button class="btn btn-danger btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#deleteModal"
                th:attr="data-id=${song.id}, data-name=${song.name}">
          <i class="bi bi-trash"></i> Xóa
        </button>
      </td>

    </tr>
    </tbody>
  </table>
</div>


<!-- ⚠ MODAL XÁC NHẬN XOÁ -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" th:action="@{/songs/delete}">
        <div class="modal-header">
          <h5 class="modal-title">Xác nhận xoá bài hát</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <p>Bạn có chắc chắn muốn xoá bài hát:</p>
          <h5 id="songName" class="text-danger"></h5>
        </div>

        <div class="modal-footer">
          <input type="hidden" name="id" id="songId">

          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Hủy
          </button>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Xoá
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Truyền dữ liệu vào Modal
  let modal = document.getElementById('deleteModal');
  modal.addEventListener('show.bs.modal', function (event) {
    let button = event.relatedTarget;
    let id = button.getAttribute("data-id");
    let name = button.getAttribute("data-name");

    document.getElementById("songId").value = id;
    document.getElementById("songName").innerText = name;
  });
</script>

</body>
</html>
