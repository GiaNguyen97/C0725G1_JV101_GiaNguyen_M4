<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Upload Bài Hát</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f3f6fa;
    }
    .upload-container {
      max-width: 550px;
      margin: 50px auto;
      background: white;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="upload-container">
  <h3 class="text-center mb-4">🎵 Upload Bài Hát</h3>

  <form th:action="@{/songs/upload}" th:object="${song}" method="post" enctype="multipart/form-data">

    <div class="mb-3">
      <label class="form-label">Tên bài hát</label>
      <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Nghệ sĩ</label>
      <input type="text" th:field="*{artist}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Thể loại</label>
      <input type="text" th:field="*{category}" class="form-control" required>
      <div class="form-text">Ví dụ: Pop, Ballad, EDM…</div>
    </div>

    <div class="mb-3">
      <label class="form-label">Chọn file nhạc</label>
      <input type="file" th:field="*{file}" class="form-control" required>
    </div>

    <p th:if="${error}" th:text="${error}" class="text-danger fw-bold"></p>

    <div class="text-center">
      <button class="btn btn-primary px-4">Upload</button>
      <a href="/songs" class="btn btn-secondary px-4">Danh sách</a>
    </div>
  </form>
</div>

</body>
</html>
