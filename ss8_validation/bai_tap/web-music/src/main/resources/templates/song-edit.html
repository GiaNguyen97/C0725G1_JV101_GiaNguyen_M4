<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sửa bài hát</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
  <h3>Sửa bài hát</h3>

  <form th:action="@{'/songs/update/' + ${song.id}}" method="post" enctype="multipart/form-data">

    <div class="mb-3">
      <label>Tên bài hát</label>
      <input type="text" name="name" th:value="${song.name}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Nghệ sĩ</label>
      <input type="text" name="artist" th:value="${song.artist}" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Thể loại</label>
      <input type="text" name="category" th:value="${song.category}" class="form-control">
    </div>

    <div class="mb-3">
      <label>File nhạc mới (không bắt buộc)</label>
      <input type="file" name="fileMusic" class="form-control">
    </div>

    <button class="btn btn-primary">Cập nhật</button>
    <a href="/songs" class="btn btn-secondary">Hủy</a>

  </form>
</div>

</body>
</html>
