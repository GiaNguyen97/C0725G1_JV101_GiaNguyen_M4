<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f4f7;
        }
        .card {
            border-radius: 12px;
        }
        .error-text {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .required::after {
            content: " *";
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-4">Đăng ký tài khoản</h3>

                <form th:action="@{/register}" th:object="${user}" method="post">

                    <!-- Firstname -->
                    <div class="mb-3">
                        <label class="form-label required" >Firstname</label>
                        <input type="text" class="form-control" th:field="*{firstName}">
                        <div class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                    </div>

                    <!-- Lastname -->
                    <div class="mb-3 ">
                        <label class="form-label required">Lastname</label>
                        <input type="text" class="form-control" th:field="*{lastName}">
                        <div class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                    </div>

                    <!-- Phone -->
                    <div class="mb-3">
                        <label class="form-labe required">Số điện thoại</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}">
                        <div class="error-text" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>

                    <!-- Age -->
                    <div class="mb-3">
                        <label class="form-label required">Tuổi</label>
                        <input type="number" class="form-control" th:field="*{age}">
                        <div class="error-text" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3 ">
                        <label class="form-label required">Email</label>
                        <input type="email" class="form-control" th:field="*{email}">
                        <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <button class="btn btn-primary w-100 mt-2">Đăng ký</button>

                </form>

            </div>

        </div>
    </div>
</div>

</body>
</html>
