<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background: #f8f9fa;
        }
        .qty-input {
            width: 70px;
            text-align: center;
        }
        .cart-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>

<body class="p-4">

<div class="container mb-3">
    <a href="/shop" class="btn btn-secondary">← Back to Shop</a>
</div>

<h1 class="text-center mb-4">🛒 Your Shopping Cart</h1>

<div class="container">

    <!-- Summary -->
    <div class="text-center mb-4">
        <h5>Total Items: <span th:text="${cart.countItemQuantity()}"></span></h5>
        <h5>Total Products: <span th:text="${cart.countProductQuantity()}"></span></h5>
    </div>

    <!-- Cart Table -->
    <table class="table table-bordered table-striped align-middle text-center">
        <thead class="table-dark">
        <tr>
            <th>Image</th>
            <th>Item</th>
            <th width="150px">Quantity</th>
            <th>Price</th>
            <th>Remove</th>
        </tr>
        </thead>

        <tbody th:each="product : ${cart.products}">
        <tr>
            <!-- Image -->
            <td>
                <img th:src="@{/images/{img}(img=${product.key.imageName})}" class="cart-img"/>
            </td>

            <!-- Name -->
            <td th:text="${product.key.name}"></td>

            <!-- Quantity controls -->
            <td>
                <div class="d-flex justify-content-center align-items-center">

                    <!-- - button -->
                    <a class="btn btn-outline-secondary btn-sm"
                       th:href="@{/cart/update/{id}(id=${product.key.id}, quantity=${product.value - 1})}"
                       th:if="${product.value > 1}">
                        -
                    </a>

                    <!-- Input quantity -->
                    <input class="form-control mx-2 qty-input"
                           type="number" min="1"
                           th:value="${product.value}"
                           th:onchange="|window.location.href='/cart/update/${product.key.id}?quantity=' + this.value|">


                    <!-- + button -->
                    <a class="btn btn-outline-secondary btn-sm"
                       th:href="@{/cart/update/{id}(id=${product.key.id}, quantity=${product.value + 1})}">
                        +
                    </a>
                </div>
            </td>

            <!-- Price -->
            <td th:text="${#numbers.formatDecimal(product.key.price * product.value, 0, 0)} + ' đ'"></td>

            <!-- Remove -->
            <td>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/cart/remove/{id}(id=${product.key.id})}">
                    ✖
                </a>
            </td>
        </tr>
        </tbody>

        <!-- Total row -->
        <tr class="fw-bold">
            <td colspan="3" class="text-end">Total Payment</td>
            <td colspan="2"
                th:text="${#numbers.formatDecimal(cart.countTotalPayment(), 0, 0)} + ' đ'">
            </td>
        </tr>

    </table>

</div>

</body>
</html>
