<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .product-card img {
            height: 180px;
            object-fit: cover;
        }
    </style>
</head>
<body class="p-4">

<!-- Cart -->
<div class="container mb-3">
    <div class="text-end">
        <a href="/shopping-cart" class="btn btn-outline-primary fw-bold">
            🛍️ Your Cart
            <span class="badge bg-danger ms-1" th:text="${cartCount}">0</span>
        </a>
    </div>
</div>

<!-- Title -->
<div class="container text-center mb-4">
    <h1 class="fw-bold text-primary">Product List</h1>
</div>

<!-- Product Grid -->
<div class="container">
    <div class="row g-4" th:if="${products}">

        <div class="col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card shadow-sm product-card">

                <!-- Product Image -->
                <a th:href="@{/detail/{id}(id=${product.id})}">
                    <img th:src="@{/images/{file}(file=${product.imageName})}" class="card-img-top" alt="Product Image">
                </a>
                <div class="card-body text-center">
                    <h5 class="card-title" th:text="${product.name}"></h5>

                    <p class="text-danger fw-bold">
                        <span th:text="${#numbers.formatDecimal(product.price, 0, 0)}"></span> đ
                    </p>

                    <a class="btn btn-success w-100"
                       th:href="@{/add/__${product.id}__(action='list')}">
                        Add to Cart
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
