<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">Danh sách sản phẩm</h2>

    <!-- Tìm kiếm -->
    <form th:action="@{/products/search}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="name" class="form-control" placeholder="Tìm kiếm theo tên">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm</button>
        </div>
    </form>

    <div class="mb-3">
        <a th:href="@{/products/add}" class="btn btn-success">+ Thêm sản phẩm</a>
    </div>

    <!-- Bảng sản phẩm -->
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>STT</th>
                <th hidden>ID</th>
                <th>Tên</th>
                <th>Giá</th>
                <th>Hãng</th>
                <th>Hành động</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p, st : ${products}">
                <td th:text="${st.index + 1}"></td>
                <td hidden th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                <td th:text="${p.manufacturer}"></td>
                <td>
                    <a class="btn btn-sm btn-info" th:href="@{/products/{id}(id=${p.id})}">Chi tiết</a>
                    <a class="btn btn-sm btn-warning" th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a>
                    <button type="button"
                            class="btn btn-sm btn-danger"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteModal"
                            th:attr="data-id=${p.id}, data-name=${p.name}">
                        Xoá
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Xác nhận Xoá -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Xác nhận xoá</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Bạn có chắc muốn xoá sản phẩm <strong id="productName"></strong>?
            </div>
            <div class="modal-footer">
                <form th:action="@{/products/delete}" method="post">
                    <input type="hidden" id="deleteId" name="id">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-danger">Xoá</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Toast thông báo -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toastMsg" class="toast align-items-center border-0"
         th:classappend="${toastType}" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" th:text="${toastMessage}">Thao tác thành công!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Modal Xóa: gán id + tên sản phẩm
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');

        const productName = deleteModal.querySelector('#productName');
        productName.textContent = name;

        const deleteIdInput = deleteModal.querySelector('#deleteId');
        deleteIdInput.value = id;
    });

    // Toast tự động hiển thị nếu có message từ server
    window.addEventListener('load', function () {
        const toastEl = document.getElementById('toastMsg');
        if (toastEl && toastEl.querySelector('.toast-body').textContent.trim() !== '') {
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }
    });
</script>

</body>
</html>
