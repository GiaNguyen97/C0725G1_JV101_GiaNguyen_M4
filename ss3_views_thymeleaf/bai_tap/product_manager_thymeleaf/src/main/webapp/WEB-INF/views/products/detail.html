<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thông tin sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Thông tin sản phẩm</h2>

    <div class="card shadow-sm p-4">

        <!-- ID (ẩn nếu muốn) -->
        <p hidden>ID:
            <span th:text="${product.id}"></span>
        </p>

        <p><strong>Tên: </strong>
            <span th:text="${product.name}"></span>
        </p>

        <p><strong>Giá: </strong>
            <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span> đ
        </p>

        <p><strong>Mô tả: </strong>
            <span th:text="${product.description}"></span>
        </p>

        <p><strong>Hãng sản xuất: </strong>
            <span th:text="${product.manufacturer}"></span>
        </p>

    </div>

    <div class="text-center mt-3">
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </div>

</div>

</body>
</html>
