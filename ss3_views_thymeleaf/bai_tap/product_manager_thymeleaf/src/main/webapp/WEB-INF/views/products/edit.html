<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Sửa sản phẩm</h2>

    <div class="card shadow-sm p-4">

        <form th:action="@{/products/edit}" th:object="${product}" method="post">

            <!-- ID ẩn -->
            <input type="hidden" th:field="*{id}">

            <!-- Tên -->
            <div class="mb-3">
                <label class="form-label">Tên sản phẩm</label>
                <input type="text" class="form-control" th:field="*{name}" required>
            </div>

            <!-- Giá -->
            <div class="mb-3">
                <label class="form-label">Giá</label>

                <!-- Không bị E -->
                <input type="number"
                       class="form-control"
                       th:field="*{price}"
                       step="0.01"
                       min="0"
                       required>
            </div>

            <!-- Mô tả -->
            <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <input type="text" class="form-control" th:field="*{description}">
            </div>

            <!-- Nhà sản xuất -->
            <div class="mb-3">
                <label class="form-label">Nhà sản xuất</label>
                <input type="text" class="form-control" th:field="*{manufacturer}">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Lưu thay đổi</button>
        </form>

    </div>

    <div class="text-center mt-3">
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </div>

</div>

</body>
</html>
