<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thêm sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-4">Thêm sản phẩm</h2>

    <div class="card shadow-sm p-4">
        <form th:action="@{/products/add}" th:object="${product}" method="post">

            <!-- Tên -->
            <div class="mb-3">
                <label class="form-label">Tên sản phẩm</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="Nhập tên sản phẩm" required>
            </div>

            <!-- Giá -->
            <div class="mb-3">
                <label class="form-label">Giá</label>

                <!-- Không bị lỗi E khi nhập số -->
                <input type="number"
                       class="form-control"
                       th:field="*{price}"
                       placeholder="Nhập giá"
                       step="0.01"
                       min="0"
                       required>
            </div>

            <!-- Mô tả -->
            <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <input type="text" class="form-control" th:field="*{description}" placeholder="Nhập mô tả sản phẩm">
            </div>

            <!-- Nhà sản xuất -->
            <div class="mb-3">
                <label class="form-label">Nhà sản xuất</label>
                <input type="text" class="form-control" th:field="*{manufacturer}" placeholder="Nhập tên hãng">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-3">Lưu sản phẩm</button>
        </form>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/products}" class="btn btn-secondary">Quay lại</a>
    </div>
</div>

</body>
</html>
