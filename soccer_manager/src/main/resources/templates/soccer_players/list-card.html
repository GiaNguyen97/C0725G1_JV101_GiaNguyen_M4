<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>
<style>
  .hover-shadow:hover {
    transform: translateY(-5px);
    box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
  }

  .transition-all {
    transition: all .3s ease-in-out;
  }

  .avatar-placeholder {
    font-weight: bold;
    color: #6c757d;
  }

  .ratio-3x4 {
    --bs-aspect-ratio: 133.33%;
    /* 4/3 height/width for portrait */
  }
</style>

<body>
  <div th:replace="~{/common/layout :: header}"></div>

  <div class="container">
    <form method="get" action="/soccers" class="card shadow-sm p-4 mb-4 mt-4 border-0 bg-light"
      th:object="${playerSearchDTO}">
      <div class="row g-3 align-items-end">
        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold small text-uppercase">Tên cầu thủ</label>
          <input type="text" class="form-control" th:field="*{name}" placeholder="VD: Messi, Ronaldo...">
        </div>

        <div class="col-lg-3 col-md-6">
          <label class="form-label fw-semibold small text-uppercase">Vị trí</label>
          <select th:field="*{searchPosition}" class="form-select">
            <option value="">-- Tất cả vị trí --</option>
            <option value="Tiền đạo">Tiền đạo</option>
            <option value="Tiền vệ">Tiền vệ</option>
            <option value="Trung vệ">Trung vệ</option>
            <option value="Hậu vệ">Hậu vệ</option>
            <option value="Thủ môn">Thủ môn</option>
          </select>
        </div>

        <div class="col-lg-4 col-md-8">
          <label class="form-label fw-semibold small text-uppercase">Ngày sinh</label>
          <div class="input-group">
            <input type="date" class="form-control" th:field="*{dobFrom}">
            <span class="input-group-text">đến</span>
            <input type="date" class="form-control" th:field="*{dobTo}">
          </div>
        </div>

        <div class="col-lg-2 col-md-4">
          <button type="submit" class="btn btn-primary w-100 shadow-sm">
            <i class="bi bi-search"></i> Tìm kiếm
          </button>
        </div>

        <input type="hidden" th:field="*{size}" />
      </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold m-0">Danh sách cầu thủ</h3>
      <a href="/soccers/lineup" class="btn btn-primary btn-sm">Đội hình thi đấu</a>
      <a href="/soccers/favorites" class="btn btn-danger btn-sm"><i class="bi bi-heart-fill"></i> Danh sách yêu
        thích</a>
      <a th:href="@{/soccers/add}" class="btn btn-success btn-sm">+ Thêm cầu thủ</a>

    </div>

    <div class="card p-3">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" th:if="${!soccers.isEmpty()}">
        <div class="col" th:each="row,rowStat : ${soccers}">
          <div class="card h-100 shadow-sm hover-shadow transition-all">
            <div
              class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-start">
              <div>
                <span class="badge bg-light text-dark border fw-normal" th:text="${row.codePlayer}"></span>
              </div>
              <!-- Deleted favorite button as per user request -->
            </div>

            <div class="card-body text-center pt-2">
              <div class="mb-3">
                <div class="ratio ratio-3x4 mb-2 bg-light rounded border overflow-hidden">
                  <div class="d-flex align-items-center justify-content-center h-100">
                    <a th:href="@{/soccers/{id}/detail(id=${row.id})}">
                      <img th:if="${row.urlImage != null && !row.urlImage.isEmpty()}" th:src="${row.urlImage}"
                        class="w-100 h-100" style="object-fit: cover; object-position: top;" alt="Ảnh cầu thủ">
                    </a>
                    <div th:unless="${row.urlImage != null && !row.urlImage.isEmpty()}"
                      class="d-flex flex-column align-items-center justify-content-center text-secondary h-100 w-100">
                      <i class="bi bi-person-fill display-4"></i>
                    </div>
                  </div>
                </div>
                <h5 class="card-title fw-bold mb-1 text-primary" th:text="${row.namePlayer}">Player
                  Name</h5>
              </div>

              <div class="mb-3">
                <span th:switch="${row.position}">
                  <span th:case="'Tiền đạo'"
                    class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                  <span th:case="'Tiền vệ'"
                    class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                  <span th:case="'Trung vệ'"
                    class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                  <span th:case="'Hậu vệ'"
                    class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                  <span th:case="'Thủ môn'"
                    class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                  <span th:case="*"
                    class="badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2"
                    th:text="${row.position}"></span>
                </span>
                <div class="mt-2">
                  <span th:if="${row.playerStatus}"
                    class="badge bg-success bg-opacity-10 text-success border border-success"><i
                      class="bi bi-check-circle-fill"></i> Đang thi đấu</span>
                  <span th:unless="${row.playerStatus}"
                    class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary"><i
                      class="bi bi-pause-circle-fill"></i> Dự bị</span>
                </div>
              </div>

              <div class="d-flex align-items-center justify-content-center gap-2 bg-light p-2 rounded">
                <th:block th:if="${row.nationalTeam != null}">
                  <img th:src="${row.nationalTeam.logoUrl}" alt="Logo" class="shadow-sm border bg-white rounded"
                    style="width: 24px; height: 24px; object-fit: contain;">
                  <span class="small fw-semibold text-dark" th:text="${row.nationalTeam.nameNationalTeam}">Team</span>
                </th:block>
                <th:block th:if="${row.nationalTeam == null}">
                  <span class="text-muted fst-italic small"><i class="bi bi-slash-circle"></i> Chưa có đội tuyển</span>
                </th:block>
              </div>
            </div>
            <div class="card-footer bg-white border-top-0 pb-3 text-center">
              <a th:href="@{/soccers/{id}/detail(id=${row.id})}" class="btn btn-outline-primary btn-sm w-100">
                <i class="bi bi-eye"></i> Xem chi tiết
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center py-5" th:if="${soccers.isEmpty()}">
        <div class="text-muted fst-italic display-6 mb-3"><i class="bi bi-search"></i></div>
        <p class="text-muted">Không tìm thấy cầu thủ nào phù hợp với điều kiện tìm kiếm.</p>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 mb-5" th:if="${soccers.totalPages > 0}">

        <div class="text-muted small d-none d-md-block">
          Tổng số: <strong th:text="${soccers.totalElements}">0</strong> cầu thủ
        </div>

        <nav aria-label="Page navigation">
          <ul class="pagination mb-0">

            <li class="page-item" th:classappend="${soccers.first} ? 'disabled'">
              <a class="page-link" th:href="${!soccers.first} ? @{/soccers(page=${soccers.number - 1})} : '#'">
                &laquo;
              </a>
            </li>

            <li class="page-item" th:classappend="${soccers.last} ? 'disabled'">
              <a class="page-link" th:href="${!soccers.last} ? @{/soccers(page=${soccers.number + 1})} : '#'">
                &raquo;
              </a>
            </li>
          </ul>
        </nav>

        <form th:action="@{/soccers}" method="get" class="d-flex align-items-center">
          <div class="input-group input-group-sm">
            <label class="input-group-text bg-white" for="pageSizeSelect">Hiển thị</label>
            <select id="pageSizeSelect" name="size" class="form-select" onchange="this.form.submit()">
              <option th:value="4" th:selected="${playerSearchDTO.size == 4}">4</option>
              <option th:value="8" th:selected="${playerSearchDTO.size == 8}">8</option>
              <option th:value="12" th:selected="${playerSearchDTO.size == 12}">12</option>
              <option th:value="16" th:selected="${playerSearchDTO.size == 16}">16</option>
              <option th:value="20" th:selected="${playerSearchDTO.size == 20}">20</option>
            </select>
          </div>
        </form>
      </div>

    </div>

    <!--TOAST-->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
      <div id="toastMessage" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
          <span id="toastIcon" class="me-2 fs-5"></span>
          <strong class="me-auto" id="toastTitle"></strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toastBody"></div>
        <div id="progressBar" class="toast-progress"></div>
      </div>
    </div>

    <script th:inline="javascript">
      document.addEventListener("DOMContentLoaded", function () {
        // Lấy dữ liệu từ FlashAttribute (Thymeleaf Inline)
        const successMsg = [[${ success }]];
        const errorMsg = [[${ error }]];

        const toastEl = document.getElementById("toastMessage");
        const toastIcon = document.getElementById("toastIcon");
        const toastTitle = document.getElementById("toastTitle");
        const toastBody = document.getElementById("toastBody");
        const progressBar = document.getElementById("progressBar");

        let show = false;

        if (successMsg) {
          toastTitle.innerText = "Thành công";
          toastTitle.className = "me-auto text-success";
          toastBody.innerText = successMsg;
          toastIcon.innerHTML = "✅"; // Hoặc dùng icon Bootstrap: <i class="bi bi-check-circle"></i>
          progressBar.style.backgroundColor = "#198754";
          show = true;
        } else if (errorMsg) {
          toastTitle.innerText = "Thông báo lỗi";
          toastTitle.className = "me-auto text-danger";
          toastBody.innerText = errorMsg;
          toastIcon.innerHTML = "❌";
          progressBar.style.backgroundColor = "#dc3545";
          show = true;
        }

        if (show) {
          const duration = 4000; // 4 giây
          progressBar.style.animationDuration = duration + "ms";
          const bsToast = new bootstrap.Toast(toastEl, { delay: duration });
          bsToast.show();
        }
      });
    </script>


    <div th:replace="~{/common/layout :: footer}"></div>
  </div>
</body>

</html>
