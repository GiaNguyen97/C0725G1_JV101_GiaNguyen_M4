<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>

<body class="bg-light"> <div th:replace="~{/common/layout :: header}"></div>

<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb shadow-sm p-3 bg-white rounded">
            <li class="breadcrumb-item">
                <a th:href="@{/soccers(page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})}"
                   class="text-decoration-none text-primary">
                    <i class="bi bi-house-door me-1"></i>Danh sách
                </a>
            </li>
            <li class="breadcrumb-item active fw-bold">Chi tiết cầu thủ</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm overflow-hidden">
        <div class="row g-0">
            <div class="col-md-4 bg-white text-center p-4 border-end">
                <div class="position-relative d-inline-block mb-3">
                    <img th:src="${soccerPlayer.urlImage}"
                         class="img-fluid shadow border border-3 border-white"
                         style="border-radius: 20px; width: 100%; max-width: 300px; height: 350px; object-fit: cover;">
                </div>

                <h3 class="fw-bold text-dark mb-2" th:text="${soccerPlayer.namePlayer}"></h3>

                <div th:switch="${soccerPlayer.position}" class="mb-3">
                    <span th:case="'Tiền đạo'" class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-3 py-2">Tiền đạo</span>
                    <span th:case="'Tiền vệ'" class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">Tiền vệ</span>
                    <span th:case="'Trung vệ'" class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2">Trung vệ</span>
                    <span th:case="'Hậu vệ'" class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-3 py-2">Hậu vệ</span>
                    <span th:case="'Thủ môn'" class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2">Thủ môn</span>
                    <span th:case="*" class="badge rounded-pill bg-secondary-subtle text-secondary px-3 py-2" th:text="${soccerPlayer.position}"></span>
                </div>
            </div>

            <div class="col-md-8 bg-white">
                <div class="card-body p-5">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <h4 class="fw-bold text-primary m-0">Thông tin cầu thủ</h4>
                        <span class="text-muted small">Mã: <span class="fw-bold" th:text="${soccerPlayer.codePlayer}"></span></span>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-sm-4 text-muted fst-italic"><i class="bi bi-calendar-event me-2"></i>Ngày sinh</div>
                        <div class="col-sm-8 fw-bold text-dark" th:text="${#temporals.format(soccerPlayer.dayOfBirth,'dd/MM/yyyy')}"></div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-sm-4 text-muted fst-italic"><i class="bi bi-star me-2"></i>Kinh nghiệm</div>
                        <div class="col-sm-8 fw-bold">
                            <span class="text-dark" th:text="${soccerPlayer.experience}"></span>
                            <span class="text-dark">Năm</span>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-sm-4 text-muted fst-italic"><i class="bi bi-flag me-2"></i>Đội tuyển</div>
                        <div class="col-sm-8">
                            <div th:if="${soccerPlayer.nationalTeam != null}" class="d-flex align-items-center gap-2">
                                <img th:src="${soccerPlayer.nationalTeam.logoUrl}"
                                     class="img-thumbnail"
                                     style="width: 45px; height: 45px; object-fit: contain; background: #f8f9fa;">
                                <span class="fw-bold text-dark" th:text="${soccerPlayer.nationalTeam.nameNationalTeam}"></span>
                            </div>
                            <span th:if="${soccerPlayer.nationalTeam == null}" class="text-muted small">Chưa cập nhật</span>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <div class="col-sm-4 text-muted fst-italic"><i class="bi bi-geo-alt me-2"></i>Địa chỉ</div>
                        <div class="col-sm-8 text-dark fw-semibold" th:text="${soccerPlayer.adress}"></div>
                    </div>

                    <div class="mt-5 d-flex gap-3 border-top pt-4">
                        <a th:href="@{/soccers(page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})}"
                           class="btn btn-light border px-4 shadow-sm">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại
                        </a>

                        <a th:href="@{/soccers/{id}/edit(id=${soccerPlayer.id}, page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})}"
                           class="btn btn-warning text-white px-4 shadow-sm">
                            <i class="bi bi-pencil-square me-1"></i> Chỉnh sửa
                        </a>

                        <button class="btn btn-outline-danger px-4 shadow-sm ms-auto" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                th:data-id="${soccerPlayer.id}" th:data-name="${soccerPlayer.namePlayer}">
                            <i class="bi bi-trash me-1"></i> Xóa cầu thủ
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle me-2"></i>Xác nhận xóa</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-center">
                <p class="mb-0 fs-5">Bạn có chắc chắn muốn xóa cầu thủ</p>
                <h4 class="text-danger fw-bold mt-2" id="playerName"></h4>
                <p class="text-muted small">Hành động này không thể hoàn tác.</p>
            </div>
            <div class="modal-footer bg-light">
                <button class="btn btn-secondary px-4" data-bs-dismiss="modal">Hủy</button>
                <form id="deleteForm" method="post">
                    <input type="hidden" name="name" th:value="${name}" />
                    <input type="hidden" name="dobFrom" th:value="${dobFrom}" />
                    <input type="hidden" name="dobTo" th:value="${dobTo}" />
                    <input type="hidden" name="page" th:value="${page}" />
                    <input type="hidden" name="size" th:value="${size}" />
                    <input type="hidden" name="searchPosition" th:value="${searchPosition}" />
                    <button type="submit" class="btn btn-danger px-4">Đồng ý xóa</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const playerId = button.getAttribute('data-id');
        const playerName = button.getAttribute('data-name');
        document.getElementById("playerName").innerText = playerName;
        document.getElementById("deleteForm").setAttribute("action", "/soccers/" + playerId + "/delete");
    });
</script>

<div th:replace="~{/common/layout :: footer}"></div>
</body>
</html>
