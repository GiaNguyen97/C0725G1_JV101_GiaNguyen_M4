<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header -->
    <div th:replace="~{/common/layout :: header}"></div>

    <div class="container-fluid py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 container">
            <h3 class="fw-bold text-primary m-0"><i class="bi bi-diagram-3-fill me-2"></i>Đội hình thi đấu</h3>
            <a th:href="@{/soccers}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
            </a>
        </div>

        <!-- Soccer Field Container -->
        <div class="container pb-5">
            <div class="card border-0 shadow-lg overflow-hidden position-relative"
                style="background: #2e7d32; height: 900px; border-radius: 20px; border: 8px solid #fff;">

                <!-- Field Markings (CSS Drawing) -->
                <div class="position-absolute w-100 h-100" style="opacity: 0.6; pointer-events: none;">
                    <!-- Center Line -->
                    <div class="position-absolute top-50 w-100 border-top border-3 border-white opacity-75"></div>
                    <!-- Center Circle -->
                    <div class="position-absolute top-50 start-50 translate-middle border border-3 border-white rounded-circle opacity-75"
                        style="width: 150px; height: 150px;"></div>
                    <!-- Center Dot -->
                    <div class="position-absolute top-50 start-50 translate-middle bg-white rounded-circle opacity-75"
                        style="width: 12px; height: 12px;"></div>

                    <!-- Penalty Area Top -->
                    <div class="position-absolute top-0 start-50 translate-middle-x border-3 border-start border-end border-bottom border-white opacity-75"
                        style="width: 400px; height: 120px;"></div>
                    <!-- Goal Area Top -->
                    <div class="position-absolute top-0 start-50 translate-middle-x border-3 border-start border-end border-bottom border-white opacity-75"
                        style="width: 180px; height: 50px;"></div>

                    <!-- Penalty Area Bottom -->
                    <div class="position-absolute bottom-0 start-50 translate-middle-x border-3 border-start border-end border-top border-white opacity-75"
                        style="width: 400px; height: 120px;"></div>
                    <!-- Goal Area Bottom -->
                    <div class="position-absolute bottom-0 start-50 translate-middle-x border-3 border-start border-end border-top border-white opacity-75"
                        style="width: 180px; height: 50px;"></div>
                </div>

                <!-- Players Layout -->
                <div class="position-relative h-100 w-100 d-flex flex-column text-center pt-3 pb-3">

                    <!-- Tiền đạo (Forwards) - Top Area -->
                    <div class="d-flex justify-content-center align-items-center gap-5 w-100" style="flex: 3;">
                        <th:block th:each="player : ${lineup}"
                            th:if="${player != null && player.position == 'Tiền đạo'}">
                            <div th:replace="~{soccer_players/lineup :: playerFragment(${player})}"></div>
                        </th:block>
                        <span th:if="${lineup.isEmpty()}" class="d-none"></span>
                    </div>

                    <!-- Tiền vệ (Midfielders) - Mid-upper Area -->
                    <div class="d-flex justify-content-center align-items-center gap-5 w-100" style="flex: 2;">
                        <th:block th:each="player : ${lineup}"
                            th:if="${player != null && player.position == 'Tiền vệ'}">
                            <div th:replace="~{soccer_players/lineup :: playerFragment(${player})}"></div>
                        </th:block>
                    </div>

                    <!-- Hậu vệ & Trung vệ (Defenders) - Mid-lower Area -->
                    <div class="d-flex justify-content-center align-items-center gap-5 w-100" style="flex: 2;">
                        <th:block th:each="player : ${lineup}"
                            th:if="${player != null && (player.position == 'Trung vệ' || player.position == 'Hậu vệ')}">
                            <div th:replace="~{soccer_players/lineup :: playerFragment(${player})}"></div>
                        </th:block>
                    </div>

                    <!-- Thủ môn (Goalkeeper) - Bottom Goal Area -->
                    <div class="d-flex justify-content-center align-items-end w-100" style="flex: 1;">
                        <th:block th:each="player : ${lineup}"
                            th:if="${player != null && player.position == 'Thủ môn'}">
                            <div th:replace="~{soccer_players/lineup :: playerFragment(${player})}"></div>
                        </th:block>
                    </div>

                    <!-- Dự bị / Khác -->
                    <div class="position-absolute bottom-0 start-0 p-3 opacity-75">
                        <div class="d-flex gap-2">
                            <th:block th:each="player : ${lineup}"
                                th:unless="${player == null || player.position == 'Tiền đạo' || player.position == 'Tiền vệ' || player.position == 'Hậu vệ' || player.position == 'Trung vệ' || player.position == 'Thủ môn'}">
                                <div th:replace="~{soccer_players/lineup :: playerFragment(${player})}"></div>
                            </th:block>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Player Fragment -->
    <th:block th:fragment="playerFragment(player)">
        <div class="player-card d-flex flex-column align-items-center position-relative"
            style="transition: transform 0.2s;" th:if="${player != null}">
            <div class="position-relative">
                <img th:src="${player.urlImage}" alt="Player"
                    class="rounded-circle border border-3 border-white shadow bg-white"
                    style="width: 70px; height: 70px; object-fit: cover;">
                <div th:switch="${player.position}" class="position-absolute bottom-0 start-50 translate-middle-x">
                    <span th:case="'Thủ môn'" class="badge rounded-pill bg-warning text-dark border border-white small"
                        style="font-size: 0.65rem;">GK</span>
                    <span th:case="'Hậu vệ'" class="badge rounded-pill bg-info text-dark border border-white small"
                        style="font-size: 0.65rem;">DF</span>
                    <span th:case="'Trung vệ'" class="badge rounded-pill bg-info text-dark border border-white small"
                        style="font-size: 0.65rem;">CB</span>
                    <span th:case="'Tiền vệ'" class="badge rounded-pill bg-primary border border-white small"
                        style="font-size: 0.65rem;">MF</span>
                    <span th:case="'Tiền đạo'" class="badge rounded-pill bg-danger border border-white small"
                        style="font-size: 0.65rem;">FW</span>
                    <span th:case="*" class="badge rounded-pill bg-secondary border border-white small"
                        style="font-size: 0.65rem;">?</span>
                </div>
            </div>
            <div class="mt-2 text-white text-shadow-sm bg-dark bg-opacity-50 px-2 rounded-2"
                style="backdrop-filter: blur(2px);">
                <div class="fw-bold small text-nowrap" th:text="${player.namePlayer}"></div>
                <div class="small opacity-75" style="font-size: 0.7rem;" th:text="${player.codePlayer}"></div>
            </div>
            <a th:href="@{/soccers/{id}/detail(id=${player.id})}" class="stretched-link"></a>
        </div>
    </th:block>

    <!-- Footer -->
    <div th:replace="~{/common/layout :: footer}"></div>

    <style>
        .player-card:hover {
            transform: translateY(-5px);
            cursor: pointer;
        }

        .text-shadow-sm {
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
    </style>

</body>

</html>
