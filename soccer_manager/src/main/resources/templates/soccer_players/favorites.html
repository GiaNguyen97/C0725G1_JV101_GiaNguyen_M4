<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>
<style>
    .hover-shadow:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
    }

    .transition-all {
        transition: all .3s ease-in-out;
    }

    .ratio-3x4 {
        --bs-aspect-ratio: 133.33%;
        /* 4/3 height/width for portrait */
    }
</style>

<body>
    <div th:replace="~{/common/layout :: header}"></div>

    <div class="container py-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/soccers" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
            <h3 class="fw-bold m-0 text-danger"><i class="bi bi-heart-fill"></i> Danh sách cầu thủ yêu thích</h3>
        </div>

        <div class="card p-3">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" th:if="${!soccers.isEmpty()}">
                <div class="col" th:each="row,rowStat : ${soccers}">
                    <div class="card h-100 shadow-sm hover-shadow transition-all">
                        <div
                            class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <span class="badge bg-light text-dark border fw-normal"
                                    th:text="${row.codePlayer}"></span>
                            </div>
                            <!-- Deleted favorite button as per user request -->
                        </div>

                        <div class="card-body text-center pt-2">
                            <div class="mb-3">
                                <div class="ratio ratio-3x4 mb-2 bg-light rounded border overflow-hidden">
                                    <div class="d-flex align-items-center justify-content-center h-100">
                                        <a th:href="@{/soccers/{id}/detail(id=${row.id})}">
                                            <img th:if="${row.urlImage != null && !row.urlImage.isEmpty()}"
                                                th:src="${row.urlImage}" class="w-100 h-100"
                                                style="object-fit: cover; object-position: top;" alt="Ảnh cầu thủ">
                                        </a>
                                        <div th:unless="${row.urlImage != null && !row.urlImage.isEmpty()}"
                                            class="d-flex flex-column align-items-center justify-content-center text-secondary h-100 w-100">
                                            <i class="bi bi-person-fill display-4"></i>
                                        </div>
                                    </div>
                                </div>
                                <h5 class="card-title fw-bold mb-1 text-primary" th:text="${row.namePlayer}">Player
                                    Name</h5>
                            </div>

                            <div class="mb-3">
                                <span th:switch="${row.position}">
                                    <span th:case="'Tiền đạo'"
                                        class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                    <span th:case="'Tiền vệ'"
                                        class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                    <span th:case="'Trung vệ'"
                                        class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                    <span th:case="'Hậu vệ'"
                                        class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                    <span th:case="'Thủ môn'"
                                        class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                    <span th:case="*"
                                        class="badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2"
                                        th:text="${row.position}"></span>
                                </span>
                                <div class="mt-2">
                                    <span th:if="${row.playerStatus}"
                                        class="badge bg-success bg-opacity-10 text-success border border-success"><i
                                            class="bi bi-check-circle-fill"></i> Đang thi đấu</span>
                                    <span th:unless="${row.playerStatus}"
                                        class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary"><i
                                            class="bi bi-pause-circle-fill"></i> Dự bị</span>
                                </div>
                            </div>

                            <div class="d-flex align-items-center justify-content-center gap-2 bg-light p-2 rounded">
                                <th:block th:if="${row.nationalTeam != null}">
                                    <img th:src="${row.nationalTeam.logoUrl}" alt="Logo"
                                        class="shadow-sm border bg-white rounded"
                                        style="width: 24px; height: 24px; object-fit: contain;">
                                    <span class="small fw-semibold text-dark"
                                        th:text="${row.nationalTeam.nameNationalTeam}">Team</span>
                                </th:block>
                                <th:block th:if="${row.nationalTeam == null}">
                                    <span class="text-muted fst-italic small"><i class="bi bi-slash-circle"></i> Chưa có
                                        đội tuyển</span>
                                </th:block>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top-0 pb-3 text-center">
                            <a th:href="@{/soccers/{id}/detail(id=${row.id})}"
                                class="btn btn-outline-primary btn-sm w-100">
                                <i class="bi bi-eye"></i> Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center py-5" th:if="${soccers.isEmpty()}">
                <div class="text-muted fst-italic display-6 mb-3"><i class="bi bi-search"></i></div>
                <p class="text-muted">Không tìm thấy cầu thủ nào phù hợp với điều kiện tìm kiếm.</p>
            </div>


        </div>
    </div>

    <div th:replace="~{/common/layout :: footer}"></div>
</body>

</html>
