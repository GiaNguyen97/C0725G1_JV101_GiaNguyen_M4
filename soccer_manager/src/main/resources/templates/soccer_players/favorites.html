<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>
<style>
    .hover-shadow:hover {
        transform: translateY(-5px);
        box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
    }

    .transition-all {
        transition: all .3s ease-in-out;
    }
</style>

<body>
    <div th:replace="~{/common/layout :: header}"></div>

    <div class="container py-5">
        <div class="d-flex align-items-center gap-3 mb-4">
            <a href="/soccers" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại</a>
            <h3 class="fw-bold m-0 text-danger"><i class="bi bi-heart-fill"></i> Danh sách cầu thủ yêu thích</h3>
        </div>

        <div class="card p-3 shadow-sm border-0 bg-light">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" th:if="${!soccers.isEmpty()}">
                <div class="col" th:each="row,rowStat : ${soccers}">
                    <div class="card h-100 shadow-sm hover-shadow transition-all">
                        <div
                            class="card-header bg-white border-bottom-0 pt-3 pb-0 d-flex justify-content-between align-items-start">
                            <div>
                                <span class="badge bg-light text-dark border fw-normal"
                                    th:text="${row.codePlayer}"></span>
                            </div>
                            <!-- Removed favorite button as per user request -->
                        </div>

                        <div class="card-body text-center pt-2">
                            <div class="mb-3">
                                <div class="ratio ratio-1x1 mb-2 bg-light rounded border overflow-hidden">
                                    <div class="d-flex align-items-center justify-content-center h-100">
                                        <a th:href="@{/soccers/{id}/detail(id=${row.id})}">
                                            <img th:if="${row.urlImage != null && !row.urlImage.isEmpty()}"
                                                th:src="${row.urlImage}" class="w-100 h-100"
                                                style="object-fit: cover; object-position: top;" alt="Ảnh cầu thủ">
                                        </a>
                                    </div>
                                </div>
                                <h5 class="card-title fw-bold mb-1 text-primary" th:text="${row.namePlayer}">Player Name
                                </h5>
                            </div>

                            <div class="mb-3">
                                <span
                                    class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-2"
                                    th:text="${row.position}"></span>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top-0 pb-3 text-center">
                            <a th:href="@{/soccers/{id}/detail(id=${row.id})}"
                                class="btn btn-outline-primary btn-sm w-100">
                                <i class="bi bi-eye"></i> Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center py-5" th:if="${soccers.isEmpty()}">
                <div class="text-muted fst-italic display-6 mb-3"><i class="bi bi-heart-break"></i></div>
                <p class="text-muted">Bạn chưa có cầu thủ yêu thích nào.</p>
                <a href="/soccers" class="btn btn-primary mt-3">Tìm cầu thủ ngay</a>
            </div>
        </div>
    </div>

    <!--TOAST-->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
        <div id="toastMessage" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon" class="me-2 fs-5"></span>
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
            <div id="progressBar" class="toast-progress"></div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const successMsg = [[${ success }]];
            const errorMsg = [[${ error }]];

            const toastEl = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");
            const toastTitle = document.getElementById("toastTitle");
            const toastBody = document.getElementById("toastBody");
            const progressBar = document.getElementById("progressBar");

            let show = false;

            if (successMsg) {
                toastTitle.innerText = "Thành công";
                toastTitle.className = "me-auto text-success";
                toastBody.innerText = successMsg;
                toastIcon.innerHTML = "✅";
                progressBar.style.backgroundColor = "#198754";
                show = true;
            } else if (errorMsg) {
                toastTitle.innerText = "Thông báo lỗi";
                toastTitle.className = "me-auto text-danger";
                toastBody.innerText = errorMsg;
                toastIcon.innerHTML = "❌";
                progressBar.style.backgroundColor = "#dc3545";
                show = true;
            }

            if (show) {
                const duration = 4000;
                progressBar.style.animationDuration = duration + "ms";
                const bsToast = new bootstrap.Toast(toastEl, { delay: duration });
                bsToast.show();
            }
        });
    </script>
    <div th:replace="~{/common/layout :: footer}"></div>
</body>

</html>
