<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/layout :: html_head}"></head>

<body>
    <div th:replace="~{/layout :: header}"></div>

    <div class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a
                        th:href="@{/soccers(page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}">Danh
                        sách</a></li>
                <li class="breadcrumb-item active">Chi tiết cầu thủ</li>
            </ol>
        </nav>

        <div class="card overflow-hidden">
            <div class="row g-0">
                <div class="col-md-4 bg-light text-center p-4 border-end">
                    <img th:src="${soccer_player.urlImage}" class="img-fluid shadow-sm"
                        style="border-radius: 15px; max-height: 400px; width: 100%; object-fit: cover;">
                    <h4 class="mt-3 fw-bold" th:text="${soccer_player.namePlayer}"></h4>
                    <span class="badge bg-primary px-3 py-2" th:text="${soccer_player.position}"></span>
                </div>
                <div class="col-md-8">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold mb-4">Thông tin cá nhân</h5>
                        <div class="row mb-3 border-bottom pb-2">
                            <div class="col-sm-4 text-muted">Mã cầu thủ</div>
                            <div class="col-sm-8 fw-semibold" th:text="${soccer_player.codePlayer}"></div>
                        </div>
                        <div class="row mb-3 border-bottom pb-2">
                            <div class="col-sm-4 text-muted">Ngày sinh</div>
                            <div class="col-sm-8 fw-semibold"
                                th:text="${#temporals.format(soccer_player.dayOfBirth,'dd/MM/yyyy')}"></div>
                        </div>
                        <div class="row mb-3 border-bottom pb-2">
                            <div class="col-sm-4 text-muted">Kinh nghiệm</div>
                            <div class="col-sm-8 fw-semibold" th:text="${soccer_player.experience + ' năm'}">
                            </div>
                        </div>

                        <div class="row mb-3 border-bottom pb-2">
                            <div class="col-sm-4 text-muted">Địa chỉ</div>
                            <div class="col-sm-8 fw-semibold" th:text="${soccer_player.adress}"></div>
                        </div>

                        <div class="mt-5 d-flex gap-2">

                            <a th:href="@{/soccers(page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                                class="btn btn-outline-secondary">
                                Quay lại
                            </a>

                            <a th:href="@{/soccers/{id}/edit(id=${soccer_player.id}, page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                                class="btn btn-warning text-white">
                                Chỉnh sửa
                            </a>

                            <button class="btn btn-danger btn-sm" data-bs-toggle="modal" data-bs-target="#deleteModal"
                                th:data-id="${soccer_player.id}" th:data-name="${soccer_player.namePlayer}">
                                Xóa
                            </button>


                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--MODAL-->

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa cầu thủ
                    <strong id="playerName"></strong> không?
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy
                    </button>

                    <form id="deleteForm" method="post">
                        <!-- Hidden params to preserve state in delete -->
                        <input type="hidden" name="name" th:value="${name}" />
                        <input type="hidden" name="dobFrom" th:value="${dobFrom}" />
                        <input type="hidden" name="dobTo" th:value="${dobTo}" />
                        <input type="hidden" name="page" th:value="${page}" />
                        <input type="hidden" name="size" th:value="${size}" />
                        <button type="submit" class="btn btn-danger">
                            Xóa
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const deleteModal = document.getElementById('deleteModal');

        deleteModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;

            const playerId = button.getAttribute('data-id');
            const playerName = button.getAttribute('data-name');

            document.getElementById("playerName").innerText = playerName;

            document.getElementById("deleteForm")
                .setAttribute("action", "/soccers/" + playerId + "/delete");
        });
    </script>

    <div th:replace="~{/layout :: footer}"></div>
</body>

</html>
