<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/common/layout :: html_head}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header (Optional) -->
    <div th:replace="~{/common/layout :: header}"></div>

    <div class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 py-5">
        <div class="text-center card border-0 shadow-lg p-5 bg-white rounded-4" style="max-width: 600px;">
            <div class="mb-4">
                <div class="position-relative d-inline-block">
                    <i class="bi bi-people-fill text-warning display-1"></i>
                    <i
                        class="bi bi-exclamation-circle-fill text-danger position-absolute top-0 end-0 fs-1 bg-white rounded-circle"></i>
                </div>
            </div>

            <h1 class="display-6 fw-bold text-dark mb-3">Đội hình đã đầy</h1>

            <div class="alert alert-warning border-0 bg-warning bg-opacity-10 text-warning-emphasis mb-4">
                <i class="bi bi-info-circle-fill me-2"></i>Giới hạn 11 cầu thủ
            </div>

            <p class="lead text-muted mb-4">
                Đội bóng của bạn đã có đủ <strong>11 cầu thủ</strong> đăng ký thi đấu chính thức.
                <br>
                Vui lòng chuyển bớt cầu thủ sang trạng thái <strong>"Dự bị"</strong> trước khi thêm mới.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 fw-semibold">
                    <i class="bi bi-arrow-left me-2"></i>Quay lại
                </a>
                <a th:href="@{/soccers/lineup}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-list-ul me-2"></i>Xem danh sách cầu thủ thi đấu
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{/common/layout :: footer}"></div>

</body>

</html>
