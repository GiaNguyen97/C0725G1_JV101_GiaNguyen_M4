<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/layout :: html_head}"></head>

<body>
    <div th:replace="~{/layout :: header}"></div>

    <div class="container">
        <form method="get" action="/soccers" class="card p-3 mb-4 mt-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Tên cầu thủ</label>
                    <input type="text" class="form-control" name="name" th:value="${name}" placeholder="Nhập tên...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Ngày sinh từ</label>
                    <input type="date" class="form-control" name="dobFrom" th:value="${dobFrom}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Đến ngày</label>
                    <input type="date" class="form-control" name="dobTo" th:value="${dobTo}">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
                <input type="hidden" name="size" th:value="${size}" />
            </div>
        </form>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0">Danh sách cầu thủ</h3>
            <a th:href="@{/soccers/add(page=${soccers.number}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                class="btn btn-success btn-sm">+ Thêm cầu thủ</a>
        </div>

        <div class="card p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th class="text-center">STT</th>
                            <th>Mã cầu thủ</th>
                            <th>Họ và tên</th>
                            <th>Ngày sinh</th>
                            <th>Vị trí</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody th:if="${!soccers.isEmpty()}">
                        <tr th:each="row,rowStat : ${soccers}">
                            <td class="text-center fw-bold" th:text="${rowStat.index+1}"></td>
                            <td th:text="${row.codePlayer}" class="text-muted"></td>
                            <td>
                                <span class="fw-semibold" th:text="${row.namePlayer}"></span>
                            </td>
                            <td th:text="${#temporals.format(row.dayOfBirth,'dd/MM/yyyy')}"></td>
                            <td><span class="badge bg-info text-dark" th:text="${row.position}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/soccers/{id}/detail(id=${row.id}, page=${soccers.number}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                                    class="btn btn-detail btn-sm px-3">
                                    Chi tiết
                                </a>
                            </td>
                        </tr>
                    </tbody>
                    <tbody th:if="${soccers.isEmpty()}">
                        <tr>
                            <td colspan="6" class="text-center text-muted fst-italic">
                                Không tìm thấy cầu thủ
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4 mb-5" th:if="${soccers.totalPages > 0}">

                <div class="text-muted small d-none d-md-block">
                    Tổng số: <strong th:text="${soccers.totalElements}">0</strong> cầu thủ
                </div>

                <nav aria-label="Page navigation">
                    <ul class="pagination mb-0">

                        <li class="page-item" th:classappend="${soccers.first} ? 'disabled'">
                            <a class="page-link"
                                th:href="${!soccers.first} ?
                    @{/soccers(page=${soccers.number - 1}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})} : '#'">
                                &laquo;
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, soccers.totalPages - 1)}"
                            th:classappend="${soccers.number == i} ? 'active'">
                            <a class="page-link"
                                th:href="@{/soccers(page=${i}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                                th:text="${i + 1}">
                            </a>
                        </li>

                        <li class="page-item" th:classappend="${soccers.last} ? 'disabled'">
                            <a class="page-link"
                                th:href="${!soccers.last} ?
                    @{/soccers(page=${soccers.number + 1}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})} : '#'">
                                &raquo;
                            </a>
                        </li>
                    </ul>
                </nav>

                <form th:action="@{/soccers}" method="get" class="d-flex align-items-center">
                    <input type="hidden" name="page" value="0" />

                    <input type="hidden" name="name" th:value="${name}" />
                    <input type="hidden" name="dobFrom" th:value="${dobFrom}" />
                    <input type="hidden" name="dobTo" th:value="${dobTo}" />

                    <div class="input-group input-group-sm">
                        <label class="input-group-text bg-white" for="pageSizeSelect">Hiển thị</label>
                        <select id="pageSizeSelect" name="size" class="form-select" onchange="this.form.submit()">
                            <option th:value="5" th:selected="${size == 5}">5</option>
                            <option th:value="10" th:selected="${size == 10}">10</option>
                            <option th:value="15" th:selected="${size == 15}">15</option>
                            <option th:value="20" th:selected="${size == 20}">20</option>
                        </select>
                    </div>
                </form>
            </div>

        </div>

        <!--TOAST-->
        <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
            <div id="toastMessage" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <span id="toastIcon" class="me-2 fs-5"></span>
                    <strong class="me-auto" id="toastTitle"></strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body" id="toastBody"></div>
                <div id="progressBar" class="toast-progress"></div>
            </div>
        </div>

        <script th:inline="javascript">
            document.addEventListener("DOMContentLoaded", function () {
                // Lấy dữ liệu từ FlashAttribute (Thymeleaf Inline)
                const successMsg = [[${ success }]];
                const errorMsg = [[${ error }]];

                const toastEl = document.getElementById("toastMessage");
                const toastIcon = document.getElementById("toastIcon");
                const toastTitle = document.getElementById("toastTitle");
                const toastBody = document.getElementById("toastBody");
                const progressBar = document.getElementById("progressBar");

                let show = false;

                if (successMsg) {
                    toastTitle.innerText = "Thành công";
                    toastTitle.className = "me-auto text-success";
                    toastBody.innerText = successMsg;
                    toastIcon.innerHTML = "✅"; // Hoặc dùng icon Bootstrap: <i class="bi bi-check-circle"></i>
                    progressBar.style.backgroundColor = "#198754";
                    show = true;
                } else if (errorMsg) {
                    toastTitle.innerText = "Thông báo lỗi";
                    toastTitle.className = "me-auto text-danger";
                    toastBody.innerText = errorMsg;
                    toastIcon.innerHTML = "❌";
                    progressBar.style.backgroundColor = "#dc3545";
                    show = true;
                }

                if (show) {
                    const duration = 4000; // 4 giây
                    progressBar.style.animationDuration = duration + "ms";
                    const bsToast = new bootstrap.Toast(toastEl, { delay: duration });
                    bsToast.show();
                }
            });
        </script>


        <div th:replace="~{/layout :: footer}"></div>
</body>

</html>
