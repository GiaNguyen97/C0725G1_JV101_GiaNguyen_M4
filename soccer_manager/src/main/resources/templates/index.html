<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/layout :: html_head}"></head>

<body>
<div th:replace="~{/layout :: header}"></div>

<div class="container">
    <form method="get" action="/soccers" class="card shadow-sm p-4 mb-4 mt-4 border-0 bg-light">
        <div class="row g-3 align-items-end">
            <div class="col-lg-3 col-md-6">
                <label class="form-label fw-semibold small text-uppercase">Tên cầu thủ</label>
                <input type="text" class="form-control" name="name" th:value="${name}"
                       placeholder="VD: Messi, Ronaldo...">
            </div>

            <div class="col-lg-3 col-md-6">
                <label class="form-label fw-semibold small text-uppercase">Vị trí</label>
                <select name="searchPosition" class="form-select">
                    <option value="">-- Tất cả vị trí --</option>
                    <option value="Tiền đạo" th:selected="${searchPosition == 'Tiền đạo'}">Tiền đạo</option>
                    <option value="Tiền vệ" th:selected="${searchPosition == 'Tiền vệ'}">Tiền vệ</option>
                    <option value="Trung vệ" th:selected="${searchPosition == 'Trung vệ'}">Trung vệ</option>
                    <option value="Hậu vệ" th:selected="${searchPosition == 'Hậu vệ'}">Hậu vệ</option>
                    <option value="Thủ môn" th:selected="${searchPosition == 'Thủ môn'}">Thủ môn</option>
                </select>
            </div>

            <div class="col-lg-4 col-md-8">
                <label class="form-label fw-semibold small text-uppercase">Ngày sinh</label>
                <div class="input-group">
                    <input type="date" class="form-control" name="dobFrom" th:value="${dobFrom}">
                    <span class="input-group-text">đến</span>
                    <input type="date" class="form-control" name="dobTo" th:value="${dobTo}">
                </div>
            </div>

            <div class="col-lg-2 col-md-4">
                <button type="submit" class="btn btn-primary w-100 shadow-sm">
                    <i class="bi bi-search"></i> Tìm kiếm
                </button>
            </div>

            <input type="hidden" name="size" th:value="${size}"/>
        </div>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">Danh sách cầu thủ</h3>
        <a th:href="@{/soccers/add(page=${soccers.number}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})}"
           class="btn btn-success btn-sm">+ Thêm cầu thủ</a>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th class="text-center">STT</th>
                    <th>Mã cầu thủ</th>
                    <th>Họ và tên</th>
                    <th>Ngày sinh</th>
                    <th>Vị trí</th>
                    <th>Đội tuyển</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody th:if="${!soccers.isEmpty()}">
                <tr th:each="row,rowStat : ${soccers}">
                    <td class="text-center fw-bold" th:text="${rowStat.index+1}"></td>
                    <td th:text="${row.codePlayer}" class="text-muted"></td>
                    <td>
                        <span class="fw-semibold" th:text="${row.namePlayer}"></span>
                    </td>
                    <td th:text="${#temporals.format(row.dayOfBirth,'dd/MM/yyyy')}"></td>
                    <td class="align-middle">
                                <span th:switch="${row.position}">
                                    <span th:case="'Tiền đạo'"
                                          class="badge rounded-pill bg-danger-subtle text-danger border border-danger-subtle px-3 py-2"
                                          th:text="${row.position}"></span>

                                    <span th:case="'Tiền vệ'"
                                          class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-3 py-2"
                                          th:text="${row.position}"></span>

                                    <span th:case="'Trung vệ'"
                                          class="badge rounded-pill bg-success-subtle text-success border border-success-subtle px-3 py-2"
                                          th:text="${row.position}"></span>

                                    <span th:case="'Hậu vệ'"
                                          class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-3 py-2"
                                          th:text="${row.position}"></span>

                                    <span th:case="'Thủ môn'"
                                          class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2"
                                          th:text="${row.position}"></span>

                                    <span th:case="*"
                                          class="badge rounded-pill bg-secondary-subtle text-secondary border border-secondary-subtle px-3 py-2"
                                          th:text="${row.position}"></span>
                                </span>
                    </td>
                    <td class="align-middle">
                        <div class="d-flex align-items-center gap-2">
                            <th:block th:if="${row.nationalTeam != null}">
                                <img th:src="${row.nationalTeam.logoUrl}"
                                     alt="Logo"
                                     class="shadow-sm border"
                                     style="width: 32px; height: 32px; border-radius: 4px; object-fit: contain; background: #fff;">

                                <span class="fw-semibold text-dark"
                                      th:text="${row.nationalTeam.nameNationalTeam}"></span>
                            </th:block>

                            <th:block th:if="${row.nationalTeam == null}">
                                <span class="text-muted fst-italic small">
                                    <i class="bi bi-slash-circle"></i> Chưa có đội tuyển
                                </span>
                            </th:block>
                        </div>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/soccers/{id}/detail(id=${row.id}, page=${soccers.number}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})}"
                           class="btn btn-detail btn-sm px-3">
                            Chi tiết
                        </a>
                    </td>
                </tr>
                </tbody>
                <tbody th:if="${soccers.isEmpty()}">
                <tr>
                    <td colspan="6" class="text-center text-muted fst-italic">
                        Không tìm thấy cầu thủ
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 mb-5" th:if="${soccers.totalPages > 0}">

            <div class="text-muted small d-none d-md-block">
                Tổng số: <strong th:text="${soccers.totalElements}">0</strong> cầu thủ
            </div>

            <nav aria-label="Page navigation">
                <ul class="pagination mb-0">

                    <li class="page-item" th:classappend="${soccers.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="${!soccers.first} ?
                    @{/soccers(page=${soccers.number - 1}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})} : '#'">
                            &laquo;
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${soccers.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="${!soccers.last} ?
                    @{/soccers(page=${soccers.number + 1}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo}, searchPosition=${searchPosition})} : '#'">
                            &raquo;
                        </a>
                    </li>
                </ul>
            </nav>

            <form th:action="@{/soccers}" method="get" class="d-flex align-items-center">
                <input type="hidden" name="page" value="0"/>

                <input type="hidden" name="name" th:value="${name}"/>
                <input type="hidden" name="dobFrom" th:value="${dobFrom}"/>
                <input type="hidden" name="dobTo" th:value="${dobTo}"/>
                <input type="hidden" name="searchPosition" th:value="${searchPosition}"/>

                <div class="input-group input-group-sm">
                    <label class="input-group-text bg-white" for="pageSizeSelect">Hiển thị</label>
                    <select id="pageSizeSelect" name="size" class="form-select" onchange="this.form.submit()">
                        <option th:value="5" th:selected="${size == 5}">5</option>
                        <option th:value="10" th:selected="${size == 10}">10</option>
                        <option th:value="15" th:selected="${size == 15}">15</option>
                        <option th:value="20" th:selected="${size == 20}">20</option>
                    </select>
                </div>
            </form>
        </div>

    </div>

    <!--TOAST-->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1060;">
        <div id="toastMessage" class="toast hide" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <span id="toastIcon" class="me-2 fs-5"></span>
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody"></div>
            <div id="progressBar" class="toast-progress"></div>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            // Lấy dữ liệu từ FlashAttribute (Thymeleaf Inline)
            const successMsg = [[${success}]];
            const errorMsg = [[${error}]];

            const toastEl = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");
            const toastTitle = document.getElementById("toastTitle");
            const toastBody = document.getElementById("toastBody");
            const progressBar = document.getElementById("progressBar");

            let show = false;

            if (successMsg) {
                toastTitle.innerText = "Thành công";
                toastTitle.className = "me-auto text-success";
                toastBody.innerText = successMsg;
                toastIcon.innerHTML = "✅"; // Hoặc dùng icon Bootstrap: <i class="bi bi-check-circle"></i>
                progressBar.style.backgroundColor = "#198754";
                show = true;
            } else if (errorMsg) {
                toastTitle.innerText = "Thông báo lỗi";
                toastTitle.className = "me-auto text-danger";
                toastBody.innerText = errorMsg;
                toastIcon.innerHTML = "❌";
                progressBar.style.backgroundColor = "#dc3545";
                show = true;
            }

            if (show) {
                const duration = 4000; // 4 giây
                progressBar.style.animationDuration = duration + "ms";
                const bsToast = new bootstrap.Toast(toastEl, {delay: duration});
                bsToast.show();
            }
        });
    </script>


    <div th:replace="~{/layout :: footer}"></div>
</div>
</body>

</html>
