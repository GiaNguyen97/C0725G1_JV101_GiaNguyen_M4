<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="~{/layout :: html_head}"></head>

<body>
    <div th:replace="~{/layout :: header}"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title fw-bold mb-0 text-primary">➕ THÊM CẦU THỦ MỚI</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/soccers/add}" th:object="${soccer_player}" method="post">
                            <!-- Hidden params to preserve state -->
                            <input type="hidden" name="name" th:value="${name}" />
                            <input type="hidden" name="dobFrom" th:value="${dobFrom}" />
                            <input type="hidden" name="dobTo" th:value="${dobTo}" />
                            <input type="hidden" name="page" th:value="${page}" />
                            <input type="hidden" name="size" th:value="${size}" />

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Mã cầu thủ </label><span
                                        style="color: red">*</span>
                                    <input type="text" th:field="*{codePlayer}" class="form-control"
                                        placeholder="Ví dụ: MCT-001" required>
                                    <span th:if="${#fields.hasErrors('codePlayer')}" th:errors="*{codePlayer}"
                                        style="color: red"></span>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Họ và tên</label><span
                                        style="color: red">*</span>
                                    <input type="text" th:field="*{namePlayer}" class="form-control"
                                        placeholder="Nhập tên cầu thủ" required>
                                    <span th:if="${#fields.hasErrors('namePlayer')}" th:errors="*{namePlayer}"
                                        style="color: red"></span>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Ngày sinh</label><span
                                        style="color: red">*</span>
                                    <input type="date" th:field="*{dayOfBirth}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Vị trí</label>
                                    <select th:field="*{position}" class="form-select">
                                        <option value="Tiền đạo">Tiền đạo</option>
                                        <option value="Tiền vệ">Tiền vệ</option>
                                        <option value="Hậu vệ">Hậu vệ</option>
                                        <option value="Thủ môn">Thủ môn</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Kinh nghiệm (năm)</label>
                                    <input type="number" th:field="*{experience}" class="form-control"
                                        placeholder="Ví dụ: Thi đấu cho đội trẻ">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Địa chỉ</label>
                                    <input type="text" th:field="*{adress}" class="form-control"
                                        placeholder="Ví dụ: Thi đấu cho đội trẻ">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">Link ảnh đại diện</label>
                                    <input type="text" th:field="*{urlImage}" class="form-control"
                                        placeholder="http://...">
                                </div>
                            </div>

                            <div class="mt-4 pt-3 border-top text-end">
                                <a th:href="@{/soccers(page=${page}, size=${size}, name=${name}, dobFrom=${dobFrom}, dobTo=${dobTo})}"
                                    class="btn btn-light px-4 me-2">Hủy</a>
                                <button type="submit" class="btn btn-primary px-4">Lưu cầu thủ</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{/layout :: footer}"></div>
</body>

</html>
