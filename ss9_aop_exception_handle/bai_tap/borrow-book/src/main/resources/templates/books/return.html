<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trả Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/books">📚 Thư viện</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item me-2">
                    <a class="btn btn-info" th:href="@{/books/borrowed}">📑 Sách Đã Mượn</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-warning" th:href="@{/books/return}">↩️ Trả Sách</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mx-auto" style="max-width: 500px;" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h1 class="card-title text-center text-success mb-4">↩️ Trả Sách</h1>
            <p class="text-center text-muted mb-4">Vui lòng nhập mã mượn để hoàn tất quá trình trả sách.</p>

            <form method="post" th:action="@{/books/return}">
                <div class="mb-3">
                    <label for="borrowCode" class="form-label fw-bold">Mã mượn:</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="borrowCode"
                           name="code"
                           placeholder="Ví dụ: LIB-12345"
                           required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 mt-3">
                    Xác nhận Trả sách
                </button>
            </form>

            <a href="/books" class="btn btn-outline-secondary w-100 mt-3">Quay lại trang chủ</a>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
