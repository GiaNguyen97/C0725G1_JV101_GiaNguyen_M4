<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${book.title}"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/books">📚 Thư viện</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item me-2">
          <a class="btn btn-info" th:href="@{/books/borrowed}">📑 Sách Đã Mượn</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-warning" th:href="@{/books/return}">↩️ Trả Sách</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div class="card shadow-lg p-3 mb-5 bg-white rounded">
    <div class="card-body">
      <h1 class="card-title display-4 text-primary mb-3" th:text="${book.title}"></h1>
      <hr>
      <h5 class="card-subtitle mb-2 text-muted">
        Tác giả: <span th:text="${book.author}"></span>
      </h5>
      <p class="card-text fs-5 mt-4">
        Số lượng còn:
        <span th:text="${book.quantity}"
              th:class="${book.quantity > 0} ? 'badge bg-success fs-6' : 'badge bg-danger fs-6'"></span>
      </p>
      <hr>
      <form th:action="@{/books/{id}/borrow(id=${book.id})}" method="post" class="mt-4">
        <button type="submit"
                class="btn btn-lg w-100"
                th:disabled="${book.quantity == 0}"
                th:classappend="${book.quantity == 0} ? 'btn-secondary' : 'btn-success'">

          <span th:if="${book.quantity == 0}">Đã hết sách</span>
          <span th:unless="${book.quantity == 0}">Mượn sách</span>
        </button>
        <div th:if="${book.quantity == 0}" class="alert alert-warning mt-2" role="alert">
          Xin lỗi, sách này hiện tại đã hết!
        </div>
      </form>

      <a href="/books" class="btn btn-outline-secondary mt-3">← Quay lại danh sách</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
