<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trả Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">

    <div class="card p-4 shadow mx-auto" style="max-width: 500px;">
        <div class="card-body">

            <h1 class="card-title text-center text-success mb-4">↩️ Trả Sách</h1>
            <p class="text-center text-muted mb-4">Vui lòng nhập mã mượn để hoàn tất quá trình trả sách.</p>

            <form method="post" th:action="@{/books/return}">

                <div class="mb-3">
                    <label for="borrowCode" class="form-label fw-bold">Mã mượn:</label>
                    <input type="text"
                           class="form-control form-control-lg"
                           id="borrowCode"
                           name="code"
                           placeholder="Ví dụ: LIB-12345"
                           required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 mt-3">
                    Xác nhận Trả sách
                </button>
            </form>

            <a href="/books" class="btn btn-outline-secondary w-100 mt-3">Quay lại trang chủ</a>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>
</body>
</html>
