<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý heo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>

    </style>
</head>

<body>
<div class="container">
<div class="modal fade" id="createModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">➕ Thêm mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <form id="createForm" method="post" action="/lands">
                    <div class="modal-body">

                        <div class="mb-3">
                            <label class="form-label">Mã giao dịch <span class="text-danger">*</span></label>
                            <input name="code" id="createCode" class="form-control" required
                                   placeholder="Ví dụ: MGD-0001">
                            <div class="invalid-feedback">Vui lòng nhập mã giao dịch</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tên khách hàng <span class="text-danger">*</span></label>
                            <select name="customers.id" id="createCustomerId" class="form-select" required>
                                <option value="">-- Chọn khách hàng --</option>
                                <option th:each="c : ${customers}"
                                        th:value="${c.idCustomer}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                            <div class="invalid-feedback">Vui lòng chọn khách hàng</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Loại bất động sản <span class="text-danger">*</span></label>
                            <select name="service" id="service" class="form-select" required>
                                <option value="">-- Chọn loại bất động sản--</option>
                                <option value="Nhà Đất">Nhà Đất</option>
                                <option value="Đất">Đất</option>
                            </select>
                            <div class="invalid-feedback">Vui lòng chọn loại bất động sản</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ngày giao dịch <span class="text-danger">*</span></label>
                            <input type="date" name="timeTransaction" id="createTimeTransaction"
                                   class="form-control" required>
                            <div class="invalid-feedback">Vui lòng chọn ngày giao dịch</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Đơn giá (VND) <span class="text-danger">*</span></label>
                            <input type="number" name="price" id="createPrice"
                                   class="form-control" min="500000" step="0.1" required
                                   placeholder="Tối thiểu 5000000">
                            <div class="invalid-feedback">Đơn giá phải >= 500.000 VND</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"> Diện tích (m2) <span class="text-danger">*</span></label>
                            <input type="number" name="area" id="createArea"
                                   class="form-control" min="20" step="0.1" required
                                   placeholder="Tối thiểu 20 m2">
                            <div class="invalid-feedback">Diện tịch phải >= 20 m2</div>
                        </div>


                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            ❌ Hủy
                        </button>
                        <button type="submit" class="btn btn-primary">
                            ✅ Thêm mới
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script>
        // Validation khi submit form
        (function() {
            'use strict';
            const form = document.getElementById('createForm');
            if (form) {
                form.addEventListener('submit', function(event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            }
        })();
    </script>
</div>
</body>

</html>
