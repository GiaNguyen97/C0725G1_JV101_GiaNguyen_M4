<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý giao dịch nhà đất</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>

        .badge {
            font-size: 0.85em;
        }
    </style>
</head>

<body>


<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Danh sách giao dịch nhà đất</h3>
        <a th:href="@{/lands/add}" class="btn btn-success">
            ➕ Thêm mới
        </a>
    </div>

    <!-- SEARCH -->
    <form class="row g-2 mb-3" method="get">
        <div class="col-md-3">
            <input class="form-control" name="name" th:value="${param.name}" placeholder="🔍 Tên khách hàng">
        </div>

        <div class="col-md-3">
            <select class="form-select" name="service">
                <option value="">Chọn loại bất động sản</option>
                <option value="Nhà Đất" th:selected="${param.service == 'Nhà Đất'}">Nhà Đất</option>
                <option value="Đất" th:selected="${param.service == 'Đất'}">Đất</option>
                <!--                <option th:each="t : ${transactionland}" th:value="${t.id}" th:text="${t.service}"-->
                <!--                th:selected="${param.service == t.service}">-->
                <!--        </option>-->
            </select>
        </div>

        <div class="col-md-3">
            <button class="btn btn-primary w-100">🔍 Tìm kiếm</button>
        </div>
    </form>

    <!-- TABLE -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>Mã giao dịch</th>
            <th>Tên khách hàng</th>
            <th>Ngày giao dịch</th>
            <th>Loại dịch vụ</th>
            <th>Đơn giá (VND/m2)</th>
            <th>Diện tích (m2)</th>
            <th>Thao tác</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${page.content}">
            <td><strong th:text="${p.codeTransactionLand}"></strong></td>
            <td th:text="${p.customer?.name ?: '-'}"></td>

            <td th:text="${p.timeTransaction != null     ? #temporals.format(p.timeTransaction, 'dd/MM/yyyy')     : '-'}">
            </td>

            <td th:text="${p.service ?: '-'}"></td>

            <td th:text="${p.price != null     ? #numbers.formatDecimal(p.price, 0, 'POINT', 0, 'COMMA')    : '-'}">
            </td>

            <td th:text="${p.area != null     ? #numbers.formatDecimal(p.area, 0, 'POINT', 0, 'COMMA')    : '-'}">
            </td>
            <td>
                <a th:href="@{/lands/{id}/detail}">Chi tiết</a>
            </td>
        </tr>

        <tr th:if="${page.content.isEmpty()}">
            <td colspan="7" class="text-center text-muted">
                Không tìm thấy giao dịch nào
            </td>
        </tr>
        </tbody>
    </table>

    <!-- PAGINATION -->
    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:if="${page.hasPrevious()}"
                   th:href="@{/lands(page=${page.number - 1}, name=${param.name}, service=${param.service})}">«</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/lands(page=${i}, name=${param.name}, service=${param.service})}"
                   th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:if="${page.hasNext()}"
                   th:href="@{/lands(page=${page.number + 1}, name=${param.name}, service=${param.service})}">»</a>
            </li>
        </ul>
    </nav>

</div>

<!-- MODALS -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
