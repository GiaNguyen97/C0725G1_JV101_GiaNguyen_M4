<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content=~{::section})}">
<body>

<section>
    <h2>Sửa blog</h2>

    <form th:action="@{/blogs/edit}" th:object="${blog}" method="post" class="mt-3">

        <input type="hidden" th:field="*{id}">

        <label>Tiêu đề</label>
        <input type="text" th:field="*{title}" class="form-control">

        <label class="mt-2">Nội dung</label>
        <textarea th:field="*{content}" class="form-control" rows="5"></textarea>

        <button class="btn btn-primary mt-3">Cập nhật</button>
    </form>
</div>
</section>
</body>
</html>
