<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { padding-top: 70px; }
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
  </style>
</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark fixed-top navbar-expand-lg px-3">
  <a class="navbar-brand" href="/blogs">My Blog</a>
  <div class="ms-auto">
    <a href="/blogs/create" class="btn btn-success btn-sm">+ New Blog</a>
    <a href="/categories" class="btn btn-outline-secondary">
      <i class="bi bi-tags"></i>
      Danh sách thể loại
    </a>
  </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
  <!-- Sửa lại phần này -->
  <th:block th:replace="${content}"></th:block>
</div>

<!-- FOOTER -->
<footer class="bg-light text-center py-3 mt-5 border-top">
  <p class="mb-0">© 2025 My Blog — Spring Boot + Thymeleaf</p>
</footer>

<!-- Toast -->
<div class="toast-container">
  <div class="toast align-items-center text-bg-success border-0" id="successToast" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">Success!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<!-- Modal Confirm Delete -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Xác nhận xóa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Bạn có chắc muốn xóa blog: <strong id="modalBlogTitle"></strong> ?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <a class="btn btn-danger" id="confirmDeleteBtn">Xóa</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function showToast(message) {
    document.getElementById("toastMessage").innerText = message;
    const toastEl = document.getElementById("successToast");
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
  }

  function confirmDelete(btn) {
    const id = btn.dataset.id;
    const title = btn.dataset.title;
    document.getElementById("modalBlogTitle").innerText = title;
    document.getElementById("confirmDeleteBtn").href = "/blogs/delete/" + id;
    const modal = new bootstrap.Modal(document.getElementById("confirmModal"));
    modal.show();
  }
</script>

</body>
</html>
