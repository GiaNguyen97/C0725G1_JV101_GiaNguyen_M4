<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{/layout :: html_head}"></head>
<body>
<div th:replace="~{/layout :: header}"></div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title fw-bold mb-0 text-primary">➕ THÊM CẦU THỦ MỚI</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/soccers/add}" th:object="${soccer_player}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mã cầu thủ</label>
                                <input type="text" th:field="*{codePlayer}" class="form-control" placeholder="Ví dụ: PL001" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" th:field="*{namePlayer}" class="form-control" placeholder="Nhập tên cầu thủ" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Ngày sinh</label>
                                <input type="date" th:field="*{dayOfBirth}" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Vị trí</label>
                                <select th:field="*{position}" class="form-select">
                                    <option value="Tiền đạo">Tiền đạo</option>
                                    <option value="Tiền vệ">Tiền vệ</option>
                                    <option value="Hậu vệ">Hậu vệ</option>
                                    <option value="Thủ môn">Thủ môn</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Kinh nghiệm thi đấu</label>
                                <input type="text" th:field="*{experience}" class="form-control" placeholder="Ví dụ: Thi đấu cho đội trẻ 3 năm">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Link ảnh đại diện</label>
                                <input type="text" th:field="*{urlImage}" class="form-control" placeholder="http://...">
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-top text-end">
                            <a href="/soccers" class="btn btn-light px-4 me-2">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4">Lưu cầu thủ</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{/layout :: footer}"></div>
</body>
</html>
