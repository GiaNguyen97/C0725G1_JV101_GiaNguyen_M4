<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý xuất xứ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/pigs">🐷 Quản lý heo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/pigs">📋 Danh sách heo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pigs/top">🏆 Top xuất chuồng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/origins">🌍 Quản lý xuất xứ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>🌍 Quản lý xuất xứ</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal">
                ➕ Thêm xuất xứ mới
            </button>
        </div>

        <!-- TABLE -->
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th style="width: 10%">ID</th>
                    <th style="width: 60%">Tên xuất xứ</th>
                    <th style="width: 30%">Hành động</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="o : ${origins}">
                    <td th:text="${o.id}"></td>
                    <td><strong th:text="${o.name}"></strong></td>
                    <td>
                        <button class="btn btn-sm btn-info" th:onclick="|openEdit(${o.id})|">✏️ Sửa</button>

                        <button class="btn btn-sm btn-danger" th:onclick="|openDelete(${o.id})|">🗑️ Xóa</button>
                    </td>
                </tr>

                <tr th:if="${origins.isEmpty()}">
                    <td colspan="3" class="text-center text-muted">
                        Chưa có xuất xứ nào
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- CREATE MODAL -->
    <div class="modal fade" id="createModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">➕ Thêm xuất xứ mới</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <form method="post" action="/origins">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Tên xuất xứ <span class="text-danger">*</span></label>
                            <input name="name" class="form-control" required placeholder="Ví dụ: Việt Nam">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">❌ Hủy</button>
                        <button type="submit" class="btn btn-success">✅ Thêm mới</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title">✏️ Sửa xuất xứ</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Tên xuất xứ <span class="text-danger">*</span></label>
                        <input id="editName" class="form-control" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">❌ Đóng</button>
                    <button class="btn btn-primary" onclick="saveEdit()">💾 Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">⚠️ Xác nhận xóa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    Bạn có chắc muốn xóa xuất xứ này?
                    <input type="hidden" id="deleteId">
                    <p class="text-danger mt-2">
                        <small>⚠️ Lưu ý: Không thể xóa xuất xứ đang được sử dụng bởi heo</small>
                    </p>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button class="btn btn-danger" onclick="confirmDelete()">Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function openEdit(id) {
            $.get('/origins/' + id, function (data) {
                $('#editId').val(data.id);
                $('#editName').val(data.name);
                $('#editModal').modal('show');
            });
        }

        function saveEdit() {
            let id = $('#editId').val();
            let data = {
                name: $('#editName').val()
            };

            $.ajax({
                url: '/origins/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: () => {
                    alert('✅ Cập nhật thành công!');
                    location.reload();
                },
                error: (xhr) => {
                    alert('❌ Lỗi: ' + (xhr.responseJSON?.message || 'Không thể cập nhật'));
                }
            });
        }

        function openDelete(id) {
            $('#deleteId').val(id);
            $('#deleteModal').modal('show');
        }

        function confirmDelete() {
            let id = $('#deleteId').val();
            $.ajax({
                url: '/origins/' + id,
                type: 'DELETE',
                success: () => {
                    alert('✅ Xóa thành công!');
                    location.reload();
                },
                error: () => {
                    alert('❌ Không thể xóa xuất xứ đang được sử dụng!');
                }
            });
        }
    </script>

</body>

</html>
