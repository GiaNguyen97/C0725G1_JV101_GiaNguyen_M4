<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Top heo xuất chuồng</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .navbar {
      margin-bottom: 20px;
    }

    .rank-badge {
      font-size: 1.2em;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/pigs">🐷 Quản lý heo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/pigs">📋 Danh sách heo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/pigs/top">🏆 Top xuất chuồng</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/origins">🌍 Quản lý xuất xứ</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">

    <h3 class="mb-3">🏆 Top heo xuất chuồng nặng nhất</h3>

    <!-- SELECT TOP -->
    <form method="get" class="mb-3 w-25">
      <select class="form-select" name="size" onchange="this.form.submit()">
        <option value="10" th:selected="${size == 10}">Top 10</option>
        <option value="20" th:selected="${size == 20}">Top 20</option>
      </select>
    </form>

    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th style="width: 10%">Hạng</th>
          <th>Mã heo</th>
          <th>Ngày xuất</th>
          <th>Trọng lượng xuất</th>
          <th>Xuất xứ</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="p, stat : ${list}">
          <td class="text-center">
            <span class="rank-badge" th:if="${stat.count == 1}">🥇</span>
            <span class="rank-badge" th:if="${stat.count == 2}">🥈</span>
            <span class="rank-badge" th:if="${stat.count == 3}">🥉</span>
            <span th:if="${stat.count > 3}" th:text="${stat.count}"></span>
          </td>
          <td><strong th:text="${p.code}"></strong></td>
          <td th:text="${p.exportTime != null ? #temporals.format(p.exportTime,'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td>
            <strong th:text="${p.exportWeight != null ? p.exportWeight + ' kg' : '-'}" class="text-success"></strong>
          </td>
          <td th:text="${p.origin?.name ?: '-'}"></td>
        </tr>

        <tr th:if="${list.isEmpty()}">
          <td colspan="5" class="text-center text-muted">
            Chưa có heo xuất chuồng
          </td>
        </tr>
      </tbody>
    </table>

    <a href="/pigs" class="btn btn-secondary">⬅ Quay lại danh sách</a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
