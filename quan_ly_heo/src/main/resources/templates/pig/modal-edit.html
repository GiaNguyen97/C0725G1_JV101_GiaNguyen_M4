<div th:fragment="editModal">
  <div class="modal fade" id="editModal">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header bg-info text-white">
          <h5 class="modal-title">✏️ Sửa thông tin heo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="editId">

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Mã heo <span class="text-danger">*</span></label>
              <input id="editCode" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Xuất xứ <span class="text-danger">*</span></label>
              <select id="editOriginId" class="form-select" required>
                <option value="">-- Chọn xuất xứ --</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Ngày nhập</label>
              <input id="editImportTime" type="datetime-local" class="form-control">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Trọng lượng nhập (kg) <span class="text-danger">*</span></label>
              <input id="editImportWeight" type="number" class="form-control" min="10" step="0.1" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Ngày xuất</label>
              <input id="editExportTime" type="datetime-local" class="form-control">
              <small class="text-muted">Để trống nếu chưa xuất chuồng</small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Trọng lượng xuất (kg)</label>
              <input id="editExportWeight" type="number" class="form-control" min="0" step="0.1">
              <small class="text-muted">Để trống nếu chưa xuất chuồng</small>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">❌ Đóng</button>
          <button class="btn btn-primary" onclick="save()">💾 Lưu</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    function save() {
      let id = $('#editId').val();
      let data = {
        code: $('#editCode').val(),
        importTime: $('#editImportTime').val() ? $('#editImportTime').val() : null,
        importWeight: parseFloat($('#editImportWeight').val()),
        exportTime: $('#editExportTime').val() ? $('#editExportTime').val() : null,
        exportWeight: $('#editExportWeight').val() ? parseFloat($('#editExportWeight').val()) : null,
        origin: {
          id: parseInt($('#editOriginId').val())
        }
      };

      $.ajax({
        url: '/pigs/' + id,
        type: 'PUT',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: () => {
          alert('✅ Cập nhật thành công!');
          location.reload();
        },
        error: (xhr) => {
          alert('❌ Lỗi: ' + (xhr.responseJSON?.message || 'Không thể cập nhật'));
        }
      });
    }
  </script>
</div>
