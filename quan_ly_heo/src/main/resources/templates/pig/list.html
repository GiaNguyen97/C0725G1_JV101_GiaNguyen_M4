<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Quản lý heo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .navbar {
      margin-bottom: 20px;
    }

    .badge {
      font-size: 0.85em;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/pigs">🐷 Quản lý heo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" href="/pigs">📋 Danh sách heo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/pigs/top">🏆 Top xuất chuồng</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/origins">🌍 Quản lý xuất xứ</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>🐷 Danh sách heo</h3>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createModal">
        ➕ Thêm heo mới
      </button>
    </div>

    <!-- SEARCH -->
    <form class="row g-2 mb-3" method="get">
      <div class="col-md-3">
        <input class="form-control" name="code" th:value="${param.code}" placeholder="🔍 Mã heo">
      </div>

      <div class="col-md-3">
        <select class="form-select" name="sold">
          <option value="">-- Tình trạng --</option>
          <option value="false" th:selected="${param.sold == 'false'}">Chưa bán</option>
          <option value="true" th:selected="${param.sold == 'true'}">Đã bán</option>
        </select>
      </div>

      <div class="col-md-3">
        <select class="form-select" name="originId">
          <option value="">-- Xuất xứ --</option>
          <option th:each="o : ${origins}" th:value="${o.id}" th:text="${o.name}"
            th:selected="${param.originId == o.id}">
          </option>
        </select>
      </div>

      <div class="col-md-3">
        <button class="btn btn-primary w-100">🔍 Tìm kiếm</button>
      </div>
    </form>

    <!-- TABLE -->
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Mã heo</th>
          <th>Ngày nhập</th>
          <th>TL nhập (kg)</th>
          <th>TL xuất (kg)</th>
          <th>Xuất xứ</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="p : ${page.content}">
          <td><strong th:text="${p.code}"></strong></td>
          <td th:text="${p.importTime != null ? #temporals.format(p.importTime,'dd/MM/yyyy HH:mm') : '-'}"></td>
          <td th:text="${p.importWeight != null ? p.importWeight + ' kg' : '-'}"></td>
          <td th:text="${p.exportWeight != null ? p.exportWeight + ' kg' : '-'}"></td>
          <td th:text="${p.origin?.name ?: '-'}"></td>

          <td>
            <span th:if="${p.sold}" class="badge bg-success">✅ Đã bán</span>
            <span th:if="${!p.sold}" class="badge bg-warning text-dark">⏳ Chưa bán</span>
          </td>

          <td>
            <button class="btn btn-sm btn-info" th:onclick="|openEdit(${p.id})|">✏️ Sửa</button>

            <button class="btn btn-sm btn-danger" th:onclick="|openDelete(${p.id})|">🗑️ Xóa</button>
          </td>
        </tr>

        <tr th:if="${page.content.isEmpty()}">
          <td colspan="7" class="text-center text-muted">
            Không tìm thấy heo nào
          </td>
        </tr>
      </tbody>
    </table>

    <!-- PAGINATION -->
    <nav th:if="${page.totalPages > 1}">
      <ul class="pagination">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
          <a class="page-link"
            th:href="@{/pigs(page=${page.number - 1}, sold=${param.sold}, code=${param.code}, originId=${param.originId})}">«</a>
        </li>

        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
          th:classappend="${i == page.number} ? 'active'">
          <a class="page-link"
            th:href="@{/pigs(page=${i}, sold=${param.sold}, code=${param.code}, originId=${param.originId})}"
            th:text="${i + 1}"></a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
          <a class="page-link"
            th:href="@{/pigs(page=${page.number + 1}, sold=${param.sold}, code=${param.code}, originId=${param.originId})}">»</a>
        </li>
      </ul>
    </nav>

  </div>

  <!-- MODALS -->
  <div th:replace="pig/modal-create :: createModal"></div>
  <div th:replace="pig/modal-edit :: editModal"></div>
  <div th:replace="pig/modal-delete :: deleteModal"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script th:inline="javascript">
    const origins = /*[[${origins}]]*/[];

    function openEdit(id) {
      $.get('/pigs/' + id, function (data) {
        console.log('Loaded pig data:', data); // Debug log

        $('#editId').val(data.id);
        $('#editCode').val(data.code);
        $('#editImportWeight').val(data.importWeight);

        // Format datetime-local for import time
        if (data.importTime) {
          const importTimeFormatted = formatDateTime(data.importTime);
          console.log('Import time:', data.importTime, '=> formatted:', importTimeFormatted);
          $('#editImportTime').val(importTimeFormatted);
        } else {
          $('#editImportTime').val('');
        }

        // Format datetime-local for export time
        if (data.exportTime) {
          const exportTimeFormatted = formatDateTime(data.exportTime);
          console.log('Export time:', data.exportTime, '=> formatted:', exportTimeFormatted);
          $('#editExportTime').val(exportTimeFormatted);
        } else {
          $('#editExportTime').val('');
        }

        $('#editExportWeight').val(data.exportWeight || '');

        // Populate origins dropdown
        let originSelect = $('#editOriginId');
        originSelect.empty();
        originSelect.append('<option value="">-- Chọn xuất xứ --</option>');
        origins.forEach(o => {
          let selected = data.origin && data.origin.id === o.id ? 'selected' : '';
          originSelect.append(`<option value="${o.id}" ${selected}>${o.name}</option>`);
        });

        $('#editModal').modal('show');
      }).fail(function (xhr, status, error) {
        console.error('Error loading pig data:', error);
        alert('❌ Lỗi khi tải dữ liệu: ' + error);
      });
    }

    function openDelete(id) {
      $('#deleteId').val(id);
      $('#deleteModal').modal('show');
    }

    /**
     * Format datetime from backend to datetime-local input format
     * Handles both array format [year, month, day, hour, minute] and string format
     */
    function formatDateTime(dateTime) {
      if (!dateTime) return '';

      // If it's an array (from LocalDateTime serialization)
      if (Array.isArray(dateTime)) {
        if (dateTime.length < 5) return '';
        const [year, month, day, hour, minute] = dateTime;
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
      }

      // If it's a string (e.g., "2024-01-05T00:00:00"), take first 16 chars
      if (typeof dateTime === 'string') {
        // datetime-local format needs "YYYY-MM-DDTHH:MM" (16 characters)
        return dateTime.substring(0, 16);
      }

      return '';
    }
  </script>

</body>

</html>
